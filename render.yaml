services:
  - type: web
    name: jimmy-blog-api
    runtime: docker
    plan: free
    branch: main
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: BLOG_ACCOUNT_ID
        value: usr_jimmy
      - key: BLOG_ACCOUNT_NAME
        value: Jimmy
      - key: BLOG_ACCOUNT_EMAIL
        sync: false
      - key: BLOG_ACCOUNT_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        # Supply the actual frontend HTTPS origin(s) in Render.
        sync: false
      - key: LOGIN_RATE_LIMIT_CLIENT_ATTEMPTS
        value: "5"
      - key: LOGIN_RATE_LIMIT_TOTAL_ATTEMPTS
        value: "100"
      - key: LOGIN_RATE_LIMIT_WINDOW_SECONDS
        value: "60"
      # LOGIN_TRUSTED_PROXY_CIDRS is deliberately unset; see docs/features/login-rate-limiting.md.
