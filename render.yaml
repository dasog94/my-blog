services:
  - type: web
    name: jimmy-blog-api
    runtime: docker
    plan: free
    branch: main
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: BLOG_ACCOUNT_ID
        value: usr_jimmy
      - key: BLOG_ACCOUNT_NAME
        value: Jimmy
      - key: BLOG_ACCOUNT_EMAIL
        sync: false
      - key: BLOG_ACCOUNT_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: http://localhost:3000
